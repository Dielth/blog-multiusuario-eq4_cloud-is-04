{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary" style="font-size: 2.5rem;"></i>
                <h2 class="h4 fw-bold mt-2">Iniciar Sesión</h2>
                <p class="text-muted small">Ingresa con tu cuenta de autor o moderador</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Entrar al Sistema</button>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <span class="text-muted small">¿Aún no tienes cuenta de autor?</span><br>
                <a href="{{ url_for('registro') }}" class="text-decoration-none fw-semibold">Crear una cuenta nueva</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
