{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill text-primary" style="font-size: 2.5rem;"></i>
                <h2 class="h4 fw-bold mt-2">Crear Cuenta de Autor</h2>
                <p class="text-muted small">Regístrate para redactar y publicar artículos en CloudBlog</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre completo *</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej. María López" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre de usuario *</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej. marialopez" required>
                    <div class="form-text">Sin espacios; lo usarás para iniciar sesión.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña *</label>
                    <input type="password" name="password" class="form-control" placeholder="Mínimo 4 caracteres" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirmar contraseña *</label>
                    <input type="password" name="confirmar" class="form-control" placeholder="Repite tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Registrarme</button>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <span class="text-muted small">¿Ya tienes una cuenta?</span>
                <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
